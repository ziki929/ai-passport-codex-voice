<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Passport · 机器人选型室</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#252825;background:#f4f3ee;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #e4773b;outline-offset:4px}.page{max-width:1120px;margin:auto;padding:46px 28px 100px}.eyebrow{font:12px monospace;letter-spacing:2px;color:#697169;display:flex;align-items:center;gap:10px}.dot{width:8px;height:8px;background:#e77947;border-radius:50%}header{display:flex;justify-content:space-between;gap:30px;align-items:flex-end;margin:20px 0 30px}h1{font-size:clamp(30px,4vw,46px);letter-spacing:-2px;font-weight:600;margin:0 0 14px}header p{font-size:14px;color:#72776f;line-height:1.9;margin:0}.edition{font:12px monospace;white-space:nowrap;color:#737970;padding-bottom:8px}.toolbar{display:flex;gap:20px;align-items:center;justify-content:space-between;border-block:1px solid #dcded6;padding:16px 0;margin-bottom:26px;flex-wrap:wrap}.seg{display:flex;gap:5px;flex-wrap:wrap}.seg button,.size{border:0;border-radius:7px;padding:9px 14px;background:transparent;color:#6a7069;font-size:13px}.seg button[aria-pressed=true]{background:#272d27;color:#fff}.size{border:1px solid #d6d9d0;background:#fff}.size[aria-pressed=true]{background:#e3e9dd;color:#253a23}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{border:1px solid #dfe1d9;background:#fbfbf8;border-radius:16px;overflow:hidden;position:relative;transition:border-color .2s,box-shadow .2s}.card.selected{border-color:#38553b;box-shadow:0 0 0 2px #38553b}.card-top{padding:19px 20px 0;display:flex;justify-content:space-between;align-items:center}.num{font:12px monospace;color:#7c8279}.tag{font-size:10px;letter-spacing:1px;color:#71796e}.stage{display:flex;justify-content:center;padding:22px 8px 23px}.device{padding:9px;background:#252c29;border-radius:24px;box-shadow:0 8px 0 #dedfd7;width:258px}.screen{height:320px;width:240px;background:var(--paper);border-radius:16px;overflow:hidden;position:relative;color:var(--ink);isolation:isolate}.screen:after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid #ffffff22;border-radius:16px}.screen-head{padding:18px 17px 0;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:650;letter-spacing:-.3px}.wifi{display:flex;align-items:flex-end;height:12px;gap:2px}.wifi i{width:3px;background:var(--accent);display:block;border-radius:1px}.wifi i:nth-child(1){height:4px}.wifi i:nth-child(2){height:8px}.wifi i:nth-child(3){height:12px}.connection{padding:7px 17px;font:9px monospace;letter-spacing:1px;opacity:.55}.hero{position:absolute;top:76px;left:0;right:0;height:127px;display:flex;align-items:center;justify-content:center}.bot{width:90px;height:108px;filter:drop-shadow(0 6px 0 #0000000b);transition:width .2s,height .2s}.small .bot{width:38px;height:48px}.eye{animation:blink 5.4s infinite;transform-box:fill-box;transform-origin:center}.card:nth-child(even) .eye{animation-delay:1.3s}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.12)}}.state{position:absolute;top:206px;width:100%;text-align:center;font-size:16px;font-weight:650;letter-spacing:.4px}.substate{position:absolute;top:234px;width:100%;text-align:center;font-size:10px;opacity:.55}.wave{height:16px;position:absolute;top:185px;left:0;right:0;display:flex;gap:3px;align-items:center;justify-content:center;opacity:0}.wave i{width:3px;height:5px;background:var(--accent);animation:wave .7s ease-in-out infinite alternate;animation-delay:calc(var(--n)*-.13s)}@keyframes wave{to{height:16px}}.listening .wave{opacity:1}.listening .hero{transform:translateY(-8px)}.listening .bot{animation:bob 1.1s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-3px)}}.thinking .bot{animation:think 1.4s ease-in-out infinite alternate}@keyframes think{to{transform:rotate(5deg)}}.stopped .eye{animation:none;transform:scaleY(.45)}.screen-foot{position:absolute;bottom:14px;left:14px;right:14px;border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;gap:4px;font-size:8px;opacity:.75}.screen-foot b{display:block;font-size:10px;font-weight:600;margin-bottom:3px}.screen-foot span{text-align:center;flex:1}.info{padding:0 20px 20px}.info h2{font-size:20px;font-weight:600;letter-spacing:-.5px;margin:0 0 9px}.info p{font-size:12px;color:#7c8178;line-height:1.8;min-height:43px;margin:0 0 17px}.pick{width:100%;text-align:left;border:1px solid #dfe2d8;border-radius:8px;background:transparent;padding:10px 12px;font-size:12px;color:#4b584b;display:flex;justify-content:space-between}.selected .pick{background:#38553b;color:#fff;border-color:#38553b}.notes{display:flex;justify-content:space-between;gap:30px;margin-top:27px;font-size:12px;color:#7c8279;line-height:1.9}.selection{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#263329;color:#fff;border-radius:40px;font-size:13px;box-shadow:0 5px 24px #0002;max-width:calc(100% - 30px);text-align:center;z-index:4}.selection[hidden]{display:none}svg{overflow:visible;shape-rendering:crispEdges}@media(max-width:940px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:610px){.grid{grid-template-columns:1fr}.page{padding:28px 20px 95px}.edition{display:none}.notes{display:block}.card{max-width:380px;width:100%;margin:auto}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="page"><div class="eyebrow"><span class="dot"></span>AI PASSPORT / CHARACTER STUDIES</div><header><div><h1>给声音，一个小伙伴。</h1><p>六种机器人，六种性格。试试录音时的样子，再选你想每天见到的那一个。</p></div><div class="edition">01—06 &nbsp; / &nbsp; 240 × 320</div></header><div class="toolbar"><div class="seg" aria-label="预览设备状态"><button data-mode="idle" aria-pressed="true">待机</button><button data-mode="listening" aria-pressed="false">正在听</button><button data-mode="thinking" aria-pressed="false">转写中</button><button data-mode="stopped" aria-pressed="false">已打断</button></div><button class="size" aria-pressed="false">小尺寸检查 · 38 × 48</button></div><section class="grid" id="grid" aria-label="机器人方案"></section><div class="notes"><div>屏幕内容按 240 × 320 像素排版。点击“小尺寸检查”，看看缩小后是否仍清楚。<br>动画是状态演示，不会访问麦克风；选中方案仅保存在此浏览器。</div><div>建议先看 <strong>02 奶油方糖</strong>：小尺寸最清楚。<br>喜欢原来像素机器人的感觉，可以选 <strong>01 围巾小电视</strong>。</div></div></main><div class="selection" role="status" hidden></div>
<script>
const r=(x,y,w,h,c,cls='')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" class="${cls}"/>`;
const path=(d,c)=>`<path d="${d}" fill="${c}"/>`;
const eyes=(a,b,y,c,w=5,h=7)=>r(a,y,w,h,c,'eye')+r(b,y,w,h,c,'eye');
const outline='#293934';
const designs=[
{id:'01',name:'围巾小电视',tag:'RETRO / 复古',desc:'保留天线和小围巾，让脸更大、轮廓更干净。像一台陪你工作的老电视。',paper:'#eee7db',ink:'#343b34',accent:'#d77b48',line:'#d7cdbd',draw:()=>r(30,4,4,8,outline)+r(27,1,10,4,'#e39358')+r(9,12,46,31,outline)+r(5,20,4,13,'#9aab93')+r(55,20,4,13,'#9aab93')+r(14,17,36,21,'#b6d5ba')+eyes(21,39,23,outline)+r(29,33,8,2,outline)+r(20,44,27,5,'#d77b48')+r(39,49,6,8,'#d77b48')+r(18,49,27,15,'#94a58d')+r(10,51,6,10,outline)+r(47,51,6,10,outline)+r(18,64,11,5,outline)+r(36,64,11,5,outline)},
{id:'02',name:'奶油方糖',tag:'MINIMAL / 极简',desc:'大眼睛、短手脚，一点点橘色。轻松、友好，缩到原来的大小也能一眼认出。',paper:'#f2eddf',ink:'#3b4039',accent:'#d08a50',line:'#dcd5c6',draw:()=>path('M18 11H46V15H53V22H57V48H53V55H44V60H20V55H11V48H7V22H11V15H18Z','#c3c4b8')+path('M18 8H46V12H53V19H57V45H53V52H44V57H20V52H11V45H7V19H11V12H18Z','#fffdf1')+r(16,23,32,19,'#35413b')+eyes(22,37,29,'#d6e8b4',5,6)+r(28,9,8,3,'#e8a26b')+r(1,32,5,12,'#e2dccb')+r(58,32,5,12,'#e2dccb')+r(19,58,9,9,'#8d9a8b')+r(37,58,9,9,'#8d9a8b')+r(29,47,6,4,'#e8a26b')},
{id:'03',name:'薄荷雷达',tag:'SIGNAL / 聆听',desc:'单眼雷达配上两只大耳朵，最像专心收音的小助手。录音时的跳动很有辨识度。',paper:'#e1ece4',ink:'#284539',accent:'#428563',line:'#bfd3c4',draw:()=>r(30,2,4,10,'#37634c')+r(26,1,12,4,'#78ad86')+path('M20 12H44V16H50V23H54V43H50V49H44V54H20V49H14V43H10V23H14V16H20Z','#579575')+r(4,24,6,19,'#a9c5a6')+r(54,24,6,19,'#a9c5a6')+path('M24 19H40V23H45V39H40V43H24V39H19V23H24Z','#263f33')+r(25,24,14,14,'#daf4b9','eye')+r(29,27,7,9,'#548160','eye')+r(28,47,8,3,'#d5eab7')+r(21,55,22,7,'#89b497')+r(18,62,10,6,'#37634c')+r(36,62,10,6,'#37634c')},
{id:'04',name:'月面巡游者',tag:'SPACE / 探索',desc:'深色宇航服和一张暖色屏幕脸。安静、沉稳，喜欢夜间仪表风格可以选它。',paper:'#242f3b',ink:'#edf0db',accent:'#e0b965',line:'#45505a',draw:()=>r(48,7,3,13,'#a1aeba')+r(46,5,7,4,'#e8b66f')+path('M20 10H44V14H51V21H55V43H51V51H43V56H21V51H13V43H9V21H13V14H20Z','#acb8bc')+path('M20 17H44V21H49V39H44V44H20V39H15V21H20Z','#e5ba70')+r(19,20,26,19,'#493e37')+eyes(23,36,25,'#ffd98b',5,7)+r(21,48,22,12,'#7e909e')+r(27,50,10,6,'#263848')+r(30,51,4,4,'#e4ad6d')+r(5,42,7,15,'#8197a2')+r(52,42,7,15,'#8197a2')+r(18,61,12,7,'#adbbbc')+r(35,61,12,7,'#adbbbc')},
{id:'05',name:'磁带搭档',tag:'AUDIO / 声音',desc:'把录音磁带变成小机器人，两只卷轴就是眼睛。强调“语音设备”，复古又俏皮。',paper:'#eee2d9',ink:'#493d36',accent:'#c57656',line:'#d9c7b9',draw:()=>r(9,15,46,36,'#774f41')+r(6,20,52,25,'#774f41')+r(11,18,42,29,'#d79b73')+r(15,22,34,17,'#f1d5a9')+r(19,26,8,9,'#694d40','eye')+r(37,26,8,9,'#694d40','eye')+r(21,28,4,5,'#eecb94','eye')+r(39,28,4,5,'#eecb94','eye')+r(27,30,10,3,'#b78e65')+path('M23 40H41L45 47H19Z','#815440')+r(1,27,5,15,'#b98064')+r(58,27,5,15,'#b98064')+r(19,52,26,10,'#bb8060')+r(17,62,12,6,'#694d40')+r(35,62,12,6,'#694d40')+r(21,8,23,4,'#815440')+r(21,12,4,3,'#815440')+r(40,12,4,3,'#815440')},
{id:'06',name:'小猫机务员',tag:'PLAYFUL / 灵动',desc:'猫耳、电子眼和一根小尾巴，表情最丰富。既是语音助手，也像桌面上的小宠物。',paper:'#e9e5ef',ink:'#443951',accent:'#8b70ae',line:'#d2c7dd',draw:()=>path('M12 8H19V12H25V18H39V12H45V8H52V44H47V49H17V44H12Z','#84739d')+r(16,13,5,10,'#c4aed7')+r(43,13,5,10,'#c4aed7')+r(17,25,30,17,'#e1d9eb')+eyes(21,37,29,'#514464',5,6)+r(30,36,4,3,'#aa7b9a')+r(24,42,16,3,'#514464')+r(22,50,22,13,'#a797bc')+r(29,52,8,6,'#e6d7bc')+r(19,63,11,5,'#6f6189')+r(36,63,11,5,'#6f6189')+path('M44 55H53V49H58V44H62V53H58V59H44Z','#84739d')}
];
let chosen;try{chosen=localStorage.getItem('passport-bot-choice')}catch{};
const grid=document.querySelector('#grid');
grid.innerHTML=designs.map(d=>`<article class="card ${chosen===d.id?'selected':''}" data-id="${d.id}"><div class="card-top"><span class="num">${d.id} /</span><span class="tag">${d.tag}</span></div><div class="stage"><div class="device"><div class="screen" style="--paper:${d.paper};--ink:${d.ink};--accent:${d.accent};--line:${d.line}"><div class="screen-head">Codex Voice<span class="wifi" aria-label="Wi-Fi 已连接"><i></i><i></i><i></i></span></div><div class="connection">AI PASSPORT · CONNECTED</div><div class="hero"><svg class="bot" viewBox="0 0 64 72" role="img" aria-label="${d.name}">${d.draw()}</svg></div><div class="wave" aria-hidden="true">${Array.from({length:11},(_,i)=>`<i style="--n:${i}"></i>`).join('')}</div><div class="state">随时听你说</div><div class="substate">按住 OK，开始说话</div><div class="screen-foot"><span><b>单击</b>发送</span><span><b>双击</b>打断</span><span><b>长按</b>说话</span></div></div></div></div><div class="info"><h2>${d.name}</h2><p>${d.desc}</p><button class="pick" aria-pressed="${chosen===d.id}"><span>${chosen===d.id?'已选中这个版本':'选择这个版本'}</span><span aria-hidden="true">${chosen===d.id?'✓':'↗'}</span></button></div></article>`).join('');
const states={idle:['随时听你说','按住 OK，开始说话'],listening:['正在听…','松开 OK，交给 Codex 转写'],thinking:['正在转成文字','稍等一下，马上就好'],stopped:['好，停下啦','准备好再叫我']};
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const mode=button.dataset.mode;grid.classList.remove('listening','thinking','stopped');if(mode!=='idle')grid.classList.add(mode);document.querySelectorAll('.state').forEach(el=>el.textContent=states[mode][0]);document.querySelectorAll('.substate').forEach(el=>el.textContent=states[mode][1])}));
document.querySelector('.size').addEventListener('click',e=>{const small=grid.classList.toggle('small');e.currentTarget.setAttribute('aria-pressed',String(small));e.currentTarget.textContent=small?'恢复大图预览':'小尺寸检查 · 38 × 48'});
function select(id){chosen=id;try{localStorage.setItem('passport-bot-choice',id)}catch{}document.querySelectorAll('.card').forEach(c=>{const active=c.dataset.id===id;c.classList.toggle('selected',active);c.querySelector('.pick').setAttribute('aria-pressed',String(active));c.querySelector('.pick').innerHTML=`<span>${active?'已选中这个版本':'选择这个版本'}</span><span aria-hidden="true">${active?'✓':'↗'}</span>`});const bar=document.querySelector('.selection');bar.hidden=false;bar.textContent=`已选 ${id} · ${designs.find(d=>d.id===id).name}　告诉我编号，就按这个继续细化。`}
document.querySelectorAll('.pick').forEach(b=>b.addEventListener('click',()=>select(b.closest('.card').dataset.id)));if(designs.some(d=>d.id===chosen))select(chosen);
</script></body></html>
